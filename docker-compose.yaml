services:
  trivy-dashboard:
    build: .
    ports:
      - "8085:8085"
    environment:
      WORKERS: "1"
    # Group that owns the Docker socket on the host: stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy-cache:/home/app/.cache/trivy
      - app-data:/data
    restart: unless-stopped

volumes:
  trivy-cache:
  app-data:
